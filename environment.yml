name: e2e
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.23
  - matplotlib
  - pillow
  - pandas
  - pytorch=1.13.1
  - torchvision=0.14.1
  - pytorch-cuda=11.7
  - pip:
      - opencv-python
      - pygame
      - shapely
      - loguru
      - pyyaml
      - pyquaternion
      - tqdm
      - tensorboard
      - timm==0.9.7
      - efficientnet-pytorch==0.7.1
      - pytorch-lightning==1.5.0
